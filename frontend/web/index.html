<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="InteriorCraft - Cloud-based Interior Design Project Management Platform with OCR Task Automation, Scikit-Learn Predictive Delay Engine, Drawing Markups, and Client Portal.">

  <!-- Mobile & Web App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InteriorCraft Studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>InteriorCraft Studio | Cloud Project Management Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0F19;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      color: #D4AF37;
    }
    .loading-spinner {
      border: 3px solid rgba(212, 175, 55, 0.15);
      border-top: 3px solid #D4AF37;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .loading-sub {
      font-size: 12px;
      color: #94A3B8;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-title">INTERIORCRAFT STUDIO</div>
    <div class="loading-sub">Loading architectural workspace...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
